name: base_repo_backend

services:
  # nodejs server configuration
  nodejs:
    image: node:26-alpine
    container_name: base_repo_server
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    command: sh -c "tail -f /dev/null"
    networks:
      - base_repo_net
    depends_on:
      postgres:
        condition: service_healthy

  # postgresql server configuration
  postgres:
    image: postgres:latest
    container_name: base_repo_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: blue
      POSTGRES_PASSWORD: adminfjsl90vvv
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - base_repo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blue"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # redis db server configuration
  redis:
    image: redis:7-alpine
    container_name: base_repo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis_db_password@2708
    volumes:
      - redis_data:/data
    networks:
      - base_repo_net

volumes:
  postgres_data:
    name: base_repo_postgres_data
  redis_data:
    name: base_repo_redis_data

networks:
  base_repo_net:
    driver: bridge